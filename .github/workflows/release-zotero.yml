name: Release Zotero plugin

on:
  push:
    tags:
      - 'zotero-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example zotero-v0.1.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check tag matches plugin version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("zotero-plugin/manifest.json").read_text(encoding="utf-8"))["version"]
          expected = f"zotero-v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Test plugin logic
        run: node --test tests/test_zotero_plugin.cjs tests/test_zotero_ieee.cjs tests/test_zotero_database.cjs tests/test_zotero_systems.cjs

      - name: Build XPI from the tagged source
        run: python3 zotero-plugin/build.py

      - name: Publish release and XPI
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > release-notes.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "search4paper for Zotero ${PLUGIN_VERSION}" \
              --notes-file release-notes.md --draft=false --prerelease=false
            gh release upload "$RELEASE_TAG" "dist/search4paper-${PLUGIN_VERSION}.xpi" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/search4paper-${PLUGIN_VERSION}.xpi" \
              --verify-tag \
              --title "search4paper for Zotero ${PLUGIN_VERSION}" \
              --notes-file release-notes.md
          fi
