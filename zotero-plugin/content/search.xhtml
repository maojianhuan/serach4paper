<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>search4paper · ICML 论文检索</title>
  <link rel="stylesheet" href="search.css" />
  <script src="core.js"></script>
  <script src="import.js"></script>
  <script src="search.js" defer="defer"></script>
</head>
<body>
  <header><h1>ICML 论文检索</h1><span>search4paper</span></header>
  <section class="query" aria-label="论文检索条件">
    <label>会议年份 <input id="year" type="number" min="2000" max="2100" value="2026" /></label>
    <label class="grow">研究方向词组 <input id="terms" value="anomaly detection" placeholder="anomaly detection; outlier detection" /></label>
    <label class="grow">上下文词组 <input id="context" value="time series" placeholder="time series; temporal" /></label>
    <button id="fetch" class="primary" title="优先读取本地名单；没有本地数据时联网获取并保存">检索 ICML 论文</button>
  </section>
  <section class="filter" aria-label="研究方向筛选">
    <span>搜索范围</span>
    <label><input id="field-title" type="checkbox" checked="checked" />标题</label>
    <label><input id="field-abstract" type="checkbox" checked="checked" />摘要</label>
    <label><input id="field-keywords" type="checkbox" checked="checked" />关键词</label>
    <label><input id="field-tldr" type="checkbox" checked="checked" />TLDR</label>
    <button id="filter" disabled="disabled">应用筛选</button>
    <button id="refresh-papers" title="重新从 OpenReview 获取所选年份的完整名单，成功后替换本地数据">刷新名单</button>
    <button id="cancel" disabled="disabled">取消操作</button>
  </section>
  <p class="hint">分号分隔的词组匹配任意一个；上下文不为空时还须匹配至少一个上下文词组。支持英文词形和连字符变化。</p>
  <p id="coverage" class="coverage">优先读取本地录用名单；首次检索联网获取并保存。需要更新时点击“刷新名单”。</p>
  <div class="workspace">
    <section class="candidates" aria-label="候选论文">
      <div class="toolbar"><strong id="count">候选论文 0 篇</strong><span id="selection">已选 0 篇</span>
        <button id="select-page" disabled="disabled">选中本页</button><button id="clear" disabled="disabled">清空选择</button></div>
      <div class="table-scroll"><table><thead><tr><th scope="col">选择</th><th scope="col">论文标题 / 命中字段</th></tr></thead><tbody id="results"></tbody></table>
        <p id="empty">检索后在这里预览候选论文；点击标题查看摘要与命中依据。</p></div>
      <div class="pagination"><button id="previous" disabled="disabled">上一页</button><span id="page">0 / 0</span><button id="next" disabled="disabled">下一页</button></div>
    </section>
    <section class="preview" aria-label="论文预览">
      <h2 id="paper-title">论文预览</h2><p id="authors" class="hint"></p>
      <p><button id="source" disabled="disabled">打开 OpenReview</button> <button id="pdf-link" disabled="disabled">打开 PDF 链接</button></p>
      <h3>摘要</h3><p id="abstract">选择一篇候选论文。</p>
      <h3>命中依据</h3><ul id="evidence"></ul>
    </section>
  </div>
  <section class="destination" aria-label="导入位置">
    <label class="grow">导入到我的文献库 <select id="collection"><option value="">我的文献库（根目录）</option></select></label>
    <button id="refresh">刷新集合</button>
    <label class="grow">新建子集合（可留空）<input id="new-collection" placeholder="留空则使用所选位置" /></label>
    <label class="grow">标签（分号分隔）<input id="tags" placeholder="time series; anomaly detection" /></label>
  </section>
  <footer><label><input id="include-pdf" type="checkbox" checked="checked" />导入后让 Zotero 获取 PDF</label>
    <button id="import" class="primary" disabled="disabled">导入选中论文</button></footer>
  <p id="status" role="status" aria-live="polite">就绪</p>
</body>
</html>
